title = "Default rules with verified public V8 size constants"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  # Public C++ pointer-size constant, not a credential. Verified in Node 24.22.0:
  # https://github.com/nodejs/node/blob/f14cd3aa7bf9ca8df2cc5b8bb14beb0f335b1d93/deps/v8/include/v8-internal.h#L187
  # Both the exact header path AND one of these two public assignments must match.
  [[rules.allowlists]]
  condition = "AND"
  paths = ['''(^|/)usr/local/include/node/v8-internal\.h$''', '''^scripts/scanner-canary\.mjs$''']
  regexTarget = "match"
  regexes = ['''^kApiTaggedSize = kApi(Int32Size|SystemPointerSize);$''']
